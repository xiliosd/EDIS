version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop

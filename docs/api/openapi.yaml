openapi: 3.1.0
info:
  description: API de la Encuesta sobre Ambiente y Desempeño Institucional (DANE).
    Las operaciones que modifican datos exigen la cabecera X-XSRF-TOKEN.
  title: API Formulario EDI/EDID
  version: v1
servers:
- url: /
security:
- sessionCookie: []
tags:
- description: Lista de comprobación y publicación de un año (rol ADMIN_CUESTIONARIO)
  name: Publicación del cuestionario
- description: Inicio y cierre de sesión
  name: Autenticación
- description: Reglas y páginas de un año para probarlas sin respuestas (ADMIN_CUESTIONARIO)
  name: Simulador de reglas
- description: Lectura y diligenciamiento del cuestionario
  name: Encuesta
- description: "Reglas de salto, validaciones y casos de prueba de un año (rol ADMIN_CUESTIONARIO).\
    \ En un año publicado cada cambio es una corrección: exige motivo (10 a 500 caracteres),\
    \ no agrega errores y no deja casos de prueba en rojo"
  name: Administración de reglas
- description: Versiones del archivo de reglas de un año y su restauración en borrador
    (rol ADMIN_CUESTIONARIO)
  name: Historial del cuestionario
- description: "Paquete verificable de un año publicado: se genera en QA y se importa\
    \ en producción (rol ADMIN_CUESTIONARIO)"
  name: Paquetes de promoción
- description: Consulta y edición de años y árbol del cuestionario (rol ADMIN_CUESTIONARIO)
  name: Administración del cuestionario
paths:
  /api/v1/admin/questionnaire/{encuesta}/{anio}:
    get:
      operationId: questionnaire
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionnaireView"
          description: "Páginas, preguntas y estado de sus columnas"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta o el año no existen
      summary: Consultar el árbol del cuestionario de una encuesta y año
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/entries/{capProyId}:
    delete:
      operationId: deactivateQuestion
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: capProyId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año o la pregunta no existen en ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o reglas vigentes\
            \ usan la pregunta (errors.rules lista sus ids)"
      summary: Desactivar una pregunta de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/entries/{capProyId}/column-script:
    get:
      description: Texto plano que ejecuta la persona técnica; la aplicación nunca
        crea columnas. Sin columnType ni columnLength el tipo se deduce de la pregunta.
      operationId: columnScript
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: capProyId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: columnType
        required: false
        schema:
          type: string
      - in: query
        name: columnLength
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            text/plain: {}
          description: Sentencia ALTER TABLE
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La pregunta no existe en ese año, no lleva columna o la columna\
            \ ya existe"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Tipo o longitud de columna incoherentes
      summary: Script ALTER TABLE de la columna pendiente de una pregunta
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/entries/{capProyId}/text:
    put:
      operationId: editQuestionText
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: capProyId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta el texto o la versión, o el texto excede\
            \ el límite"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La versión cambió o la fila la usa otro año
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El texto queda vacío o es demasiado largo, o en un año publicado\
            \ falta el motivo (10 a 500 caracteres)"
      summary: Editar el texto de una pregunta de un año (corrección con motivo si
        está publicado)
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/headers/{codEnc}:
    put:
      operationId: editHeader
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: codEnc
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta el texto o la versión, o el texto excede\
            \ el límite"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La versión cambió o la fila la usa otro año
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El texto queda vacío o es demasiado largo, o en un año publicado\
            \ falta el motivo (10 a 500 caracteres)"
      summary: Editar un encabezado de un año (corrección con motivo si está publicado)
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/help/{codAyu}:
    put:
      operationId: editHelp
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: codAyu
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta el texto o la versión, o el texto excede\
            \ el límite"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La versión cambió o la fila la usa otro año
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El texto queda vacío o es demasiado largo, o en un año publicado\
            \ falta el motivo (10 a 500 caracteres)"
      summary: Editar la ayuda de una pregunta de un año (corrección con motivo si
        está publicado)
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/history:
    get:
      description: "La versión vigente, el estado del año y cada versión guardada\
        \ con quién, cuándo, la operación y, en las correcciones, el motivo; de la\
        \ más reciente a la más antigua."
      operationId: historyView
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryView"
          description: Historial del año
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta o el año no existen
      summary: Consultar el historial de versiones de un año
      tags:
      - Historial del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/history/{version}:
    get:
      description: Devuelve el archivo de reglas tal como estaba guardado en esa versión.
      operationId: historyVersion
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
          description: Reglas de la versión
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año o la versión no existen"
      summary: Leer las reglas de una versión del historial
      tags:
      - Historial del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/history/{version}/restore:
    post:
      description: "Reemplaza saltos, validaciones, casos, tablas y columnas nuevas\
        \ por los de la versión elegida y guarda el resultado como versión nueva.\
        \ Conserva el estado y no restaura las filas FRM_*. Pasa por el mismo aná\
        lisis que cualquier cambio: los errores nuevos lo rechazan."
      operationId: historyRestore
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: version
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesEditResult"
          description: Versión restaurada; análisis y casos
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta la versión"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año o la versión no existen"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El año está publicado o la versión vigente cambió
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La restauración agrega errores de análisis (propiedad report)
      summary: Restaurar una versión del historial en un borrador
      tags:
      - Historial del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/package:
    get:
      description: "ZIP con manifiesto.json, reglas.json, frm.sql y columnas.sql.\
        \ El tipo anio instala el año completo; correccion exige una versión posterior\
        \ a la publicación y además corrige los textos de las filas que ya existen.\
        \ La persona técnica ejecuta columnas.sql y frm.sql en producción antes de\
        \ importarlo."
      operationId: packageDownload
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - description: Tipo de paquete
        in: query
        name: tipo
        required: true
        schema:
          type: string
          enum:
          - anio
          - correccion
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: Paquete del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta el tipo o no es anio ni correccion
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta o el año no existen
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El año no está publicado o no hay correcciones posteriores
            a la publicación
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El año publicado ya no pasa la lista de publicación (propiedad
            checklist)
      summary: Descargar el paquete de promoción de un año publicado
      tags:
      - Paquetes de promoción
  /api/v1/admin/questionnaire/{encuesta}/{anio}/package/import:
    post:
      description: "Comprueba el ZIP contra su manifiesto y contra esta base: los\
        \ archivos, las reglas, las filas FRM_* (que frm.sql ya debe haber dejado),\
        \ las columnas y tablas de respuesta y la versión. Con confirmar=false solo\
        \ muestra el impacto: cuántos encuestados ya guardaron cada página cuyas reglas\
        \ cambian. Con confirmar=true además reemplaza el archivo de reglas conservando\
        \ la versión del paquete. Nunca escribe en FRM_*."
      operationId: packageImport
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: confirmar
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
              required:
              - archivo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
          description: Impacto de la importación
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta no existe
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La versión del paquete no es posterior a la de este ambiente
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El paquete supera 5 MB
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El paquete no pasa una revisión; la propiedad differences lista
            lo que no coincide
      summary: Revisar o confirmar la importación de un paquete
      tags:
      - Paquetes de promoción
  /api/v1/admin/questionnaire/{encuesta}/{anio}/pages/{pageCode}/entries:
    post:
      operationId: addQuestion
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewQuestionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: faltan campos obligatorios"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o la pregunta de referencia\
            \ no existen"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o una fila la usa\
            \ otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Columna o numeral repetidos o inválidos, grupo de opciones\
            \ inexistente o tipo de columna incoherente"
      summary: Agregar una pregunta a una página de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/pages/{pageCode}/order:
    patch:
      operationId: reorderPage
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: "Página actualizada, nueva versión y saltos cuyo destino queda\
            \ antes"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: faltan los capProyIds (o la lista está vací\
            a) o la versión"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado (edición estructural), la versión cambió\
            \ o la fila la usa otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La lista no coincide con las preguntas de la página o mueve
            una pregunta de grupo
      summary: Reordenar las preguntas de una página de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/publication:
    get:
      description: "Cuatro condiciones: análisis sin errores, casos de prueba en verde,\
        \ columnas creadas y tablas válidas. Los avisos del análisis no bloquean.\
        \ También responde para años publicados, de forma informativa."
      operationId: publicationChecklist
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationChecklist"
          description: Lista de comprobación del año
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta o el año no existen
      summary: Consultar la lista de comprobación para publicar un año
      tags:
      - Publicación del cuestionario
    post:
      description: "Recalcula la lista dentro del candado de administración. Si está\
        \ completa, pasa el año a publicado y guarda quién, cuándo, la versión y los\
        \ avisos. Un año publicado solo admite correcciones."
      operationId: publishYear
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationChecklist"
          description: Año publicado; lista de comprobación vigente
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta la versión"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta o el año no existen
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El año ya está publicado o la versión cambió
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

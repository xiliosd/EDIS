openapi: 3.1.0
info:
  description: API de la Encuesta sobre Ambiente y Desempeño Institucional (DANE).
    Las operaciones que modifican datos exigen la cabecera X-XSRF-TOKEN.
  title: API Formulario EDI/EDID
  version: v1
servers:
- url: /
security:
- sessionCookie: []
tags:
- description: Inicio y cierre de sesión
  name: Autenticación
paths:
  /api/v1/auth/csrf:
    get:
      description: Emite la cookie XSRF-TOKEN.
      operationId: csrf
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
          description: OK
      security: []
      summary: Obtener token CSRF
      tags:
      - Autenticación
  /api/v1/auth/login:
    post:
      description: Emite la cookie de sesión EDI_SESSION.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión iniciada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Usuario o clave incorrectos
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos; ver Retry-After
      security: []
      summary: Iniciar sesión
      tags:
      - Autenticación
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Sesión cerrada
      security: []
      summary: Cerrar sesión
      tags:
      - Autenticación
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión vigente
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin sesión
      summary: Consultar la sesión actual
      tags:
      - Autenticación
components:
  schemas:
    CsrfTokenResponse:
      type: object
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - RESPONDENT
          - ADMINISTRATOR
        password:
          type: string
          maxLength: 100
          minLength: 0
        username:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - accountType
      - password
      - username
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    SessionResponse:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - RESPONDENT
          - ADMINISTRATOR
        departmentCode:
          type: string
        roles:
          type: array
          items:
            type: string
        surveyCode:
          type: string
        surveyYear:
          type: integer
          format: int32
  securitySchemes:
    sessionCookie:
      in: cookie
      name: EDI_SESSION
      type: apiKey

openapi: 3.1.0
info:
  description: API de la Encuesta sobre Ambiente y Desempeño Institucional (DANE).
    Las operaciones que modifican datos exigen la cabecera X-XSRF-TOKEN.
  title: API Formulario EDI/EDID
  version: v1
servers:
- url: /
security:
- sessionCookie: []
tags:
- description: Inicio y cierre de sesión
  name: Autenticación
- description: Lectura y diligenciamiento del cuestionario
  name: Encuesta
- description: Consulta y edición de años y árbol del cuestionario (rol ADMIN_CUESTIONARIO)
  name: Administración del cuestionario
paths:
  /api/v1/admin/questionnaire/{encuesta}/{anio}:
    get:
      operationId: questionnaire
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionnaireView"
          description: "Páginas, preguntas y estado de sus columnas"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta o el año no existen
      summary: Consultar el árbol del cuestionario de una encuesta y año
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/entries/{capProyId}:
    delete:
      operationId: deactivateQuestion
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: capProyId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año o la pregunta no existen en ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o reglas vigentes\
            \ usan la pregunta (errors.rules lista sus ids)"
      summary: Desactivar una pregunta de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/entries/{capProyId}/column-script:
    get:
      description: Texto plano que ejecuta la persona técnica; la aplicación nunca
        crea columnas. Sin columnType ni columnLength el tipo se deduce de la pregunta.
      operationId: columnScript
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: capProyId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: columnType
        required: false
        schema:
          type: string
      - in: query
        name: columnLength
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            text/plain: {}
          description: Sentencia ALTER TABLE
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La pregunta no existe en ese año, no lleva columna o la columna\
            \ ya existe"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Tipo o longitud de columna incoherentes
      summary: Script ALTER TABLE de la columna pendiente de una pregunta
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/entries/{capProyId}/text:
    put:
      operationId: editQuestionText
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: capProyId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta el texto o la versión, o el texto excede\
            \ el límite"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o la fila la usa\
            \ otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El texto queda vacío o es demasiado largo
      summary: Editar el texto de una pregunta de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/headers/{codEnc}:
    put:
      operationId: editHeader
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: codEnc
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta el texto o la versión, o el texto excede\
            \ el límite"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o la fila la usa\
            \ otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El texto queda vacío o es demasiado largo
      summary: Editar un encabezado de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/help/{codAyu}:
    put:
      operationId: editHelp
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: codAyu
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: falta el texto o la versión, o el texto excede\
            \ el límite"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o la fila la usa\
            \ otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El texto queda vacío o es demasiado largo
      summary: Editar la ayuda de una pregunta de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/pages/{pageCode}/entries:
    post:
      operationId: addQuestion
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewQuestionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: Página actualizada y nueva versión del año
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: faltan campos obligatorios"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o la pregunta de referencia\
            \ no existen"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o una fila la usa\
            \ otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Columna o numeral repetidos o inválidos, grupo de opciones\
            \ inexistente o tipo de columna incoherente"
      summary: Agregar una pregunta a una página de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/questionnaire/{encuesta}/{anio}/pages/{pageCode}/order:
    patch:
      operationId: reorderPage
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      - in: path
        name: anio
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEditResult"
          description: "Página actualizada, nueva versión y saltos cuyo destino queda\
            \ antes"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Cuerpo inválido: faltan los capProyIds (o la lista está vací\
            a) o la versión"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "La encuesta, el año, la página o el registro no existen en\
            \ ese año"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "El año está publicado, la versión cambió o la fila la usa\
            \ otro año"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La lista no coincide con las preguntas de la página o mueve
            una pregunta de grupo
      summary: Reordenar las preguntas de una página de un año en borrador
      tags:
      - Administración del cuestionario
  /api/v1/admin/years/{encuesta}:
    get:
      operationId: years
      parameters:
      - in: path
        name: encuesta
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YearSummary"
          description: "Años con estado, versión y año activo"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta no existe
      summary: Listar los años del cuestionario de una encuesta
      tags:
      - Administración del cuestionario
  /api/v1/auth/csrf:
    get:
      description: Emite la cookie XSRF-TOKEN.
      operationId: csrf
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
          description: OK
      security: []
      summary: Obtener token CSRF
      tags:
      - Autenticación
  /api/v1/auth/login:
    post:
      description: Emite la cookie de sesión EDI_SESSION.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión iniciada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Usuario o clave incorrectos
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos; ver Retry-After
      security: []
      summary: Iniciar sesión
      tags:
      - Autenticación
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Sesión cerrada
      security: []
      summary: Cerrar sesión
      tags:
      - Autenticación
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión vigente
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin sesión
      summary: Consultar la sesión actual
      tags:
      - Autenticación
  /api/v1/survey/chapters:
    get:
      operationId: listChapters
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChapterSummary"
          description: Capítulos B a H
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: Listar los capítulos del cuestionario
      tags:
      - Encuesta
  /api/v1/survey/chapters/{chapterCode}:
    get:
      description: Las preguntas sin columna solo las ve el administrador del cuestionario.
      operationId: getChapter
      parameters:
      - in: path
        name: chapterCode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
          description: Capítulo con sus preguntas
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El capítulo no existe
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: Consultar un capítulo
      tags:
      - Encuesta
  /api/v1/survey/finish:
    post:
      operationId: finish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishResult"
          description: Radicado de la encuesta
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Faltan páginas por guardar
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: Terminar la encuesta y obtener el radicado
      tags:
      - Encuesta
  /api/v1/survey/pages/{pageCode}:
    get:
      operationId: page
      parameters:
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDetail"
          description: Página
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La página no existe
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: "Consultar una página con sus preguntas y, si ya se guardó, sus respuestas"
      tags:
      - Encuesta
  /api/v1/survey/pages/{pageCode}/answers:
    put:
      operationId: saveAnswers
      parameters:
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageAnswersRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSaveResult"
          description: Página guardada; indica la siguiente
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La página no existe
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Página ya guardada o bloqueada
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Respuestas inválidas (errors: columna → mensaje)"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: Guardar las respuestas de una página (una sola vez)
      tags:
      - Encuesta
  /api/v1/survey/progress:
    get:
      operationId: progress
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyProgress"
          description: Estado de las 9 páginas y radicado si terminó
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: Consultar el avance del encuestado
      tags:
      - Encuesta
  /api/v1/survey/rules:
    get:
      operationId: rules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
          description: Reglas del archivo más saltos heredados
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La encuesta aún no está disponible (el año activo es un borrador)
      summary: Consultar las reglas de saltos y validaciones vigentes
      tags:
      - Encuesta
components:
  schemas:
    AdminEditResult:
      type: object
      properties:
        page:
          $ref: "#/components/schemas/AdminPage"
        skipsTargetingEarlierQuestions:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int32
    AdminEntry:
      type: object
      properties:
        capProyId:
          type: integer
          format: int64
        columnCode:
          type: string
        columnStatus:
          type: string
          enum:
          - ACTIVE
          - PENDING_COLUMN
        headers:
          type: array
          items:
            $ref: "#/components/schemas/AdminHeader"
        help:
          $ref: "#/components/schemas/AdminHelp"
        inputType:
          type: string
        kind:
          type: string
        numeral:
          type: string
        optionGroup:
          type: integer
          format: int32
        rawText:
          type: string
        referencedByRules:
          type: array
          items:
            type: string
        text:
          type: string
    AdminHeader:
      type: object
      properties:
        codEnc:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - HEADING
          - SUBTITLE
        text:
          type: string
    AdminHelp:
      type: object
      properties:
        codAyu:
          type: integer
          format: int64
        text:
          type: string
    AdminPage:
      type: object
      properties:
        chapterCode:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminEntry"
        pageCode:
          type: string
        tableName:
          type: string
    AdminQuestionnaireView:
      type: object
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/AdminPage"
        state:
          type: string
          enum:
          - borrador
          - publicado
        survey:
          type: string
        tables:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
          format: int32
        year:
          type: integer
          format: int32
    AnswerOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    AnswerSpec:
      type: object
      properties:
        columnCode:
          type: string
        columnStatus:
          type: string
          enum:
          - ACTIVE
          - PENDING_COLUMN
        inputType:
          type: string
          enum:
          - SINGLE_CHOICE
          - CHECKBOX
          - TEXT
          - UNKNOWN
        options:
          type: array
          items:
            $ref: "#/components/schemas/AnswerOption"
    ChapterDetail:
      type: object
      properties:
        code:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireEntry"
        module:
          type: string
        title:
          type: string
    ChapterSummary:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
        title:
          type: string
    Condition:
      type: object
      properties:
        alguna:
          type: array
          items:
            type: string
        o:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        op:
          type: string
        pregunta:
          type: string
        todas:
          type: array
          items:

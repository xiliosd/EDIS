openapi: 3.1.0
info:
  description: API de la Encuesta sobre Ambiente y Desempeño Institucional (DANE).
    Las operaciones que modifican datos exigen la cabecera X-XSRF-TOKEN.
  title: API Formulario EDI/EDID
  version: v1
servers:
- url: /
security:
- sessionCookie: []
tags:
- description: Inicio y cierre de sesión
  name: Autenticación
- description: Lectura del cuestionario
  name: Encuesta
paths:
  /api/v1/auth/csrf:
    get:
      description: Emite la cookie XSRF-TOKEN.
      operationId: csrf
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
          description: OK
      security: []
      summary: Obtener token CSRF
      tags:
      - Autenticación
  /api/v1/auth/login:
    post:
      description: Emite la cookie de sesión EDI_SESSION.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión iniciada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Usuario o clave incorrectos
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos; ver Retry-After
      security: []
      summary: Iniciar sesión
      tags:
      - Autenticación
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Sesión cerrada
      security: []
      summary: Cerrar sesión
      tags:
      - Autenticación
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión vigente
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin sesión
      summary: Consultar la sesión actual
      tags:
      - Autenticación
  /api/v1/survey/chapters:
    get:
      operationId: listChapters
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChapterSummary"
          description: Capítulos B a H
      summary: Listar los capítulos del cuestionario
      tags:
      - Encuesta
  /api/v1/survey/chapters/{chapterCode}:
    get:
      description: Las preguntas sin columna solo las ve el administrador del cuestionario.
      operationId: getChapter
      parameters:
      - in: path
        name: chapterCode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
          description: Capítulo con sus preguntas
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El capítulo no existe
      summary: Consultar un capítulo
      tags:
      - Encuesta
components:
  schemas:
    AnswerOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    AnswerSpec:
      type: object
      properties:
        columnCode:
          type: string
        columnStatus:
          type: string
          enum:
          - ACTIVE
          - PENDING_COLUMN
        inputType:
          type: string
          enum:
          - SINGLE_CHOICE
          - CHECKBOX
          - TEXT
          - UNKNOWN
        options:
          type: array
          items:
            $ref: "#/components/schemas/AnswerOption"
    ChapterDetail:
      type: object
      properties:
        code:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireEntry"
        module:
          type: string
        title:
          type: string
    ChapterSummary:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
        title:
          type: string
    CsrfTokenResponse:
      type: object
      properties:
        token:
          type: string
    LegacySkip:
      type: object
      properties:
        count:
          type: integer
          format: int32
        triggerValue:
          type: string
    LoginRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - RESPONDENT
          - ADMINISTRATOR
        password:
          type: string
          maxLength: 100
          minLength: 0
        username:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - accountType
      - password
      - username
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    QuestionnaireEntry:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/AnswerSpec"
        headers:
          type: array
          items:
            $ref: "#/components/schemas/SectionHeader"
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - STATEMENT
          - ITEM
        label:
          type: string
        legacySkip:
          $ref: "#/components/schemas/LegacySkip"
        numeral:
          type: string
        pageCode:
          type: string
        text:
          type: string
    SectionHeader:
      type: object
      properties:
        kind:
          type: string
          enum:
          - HEADING
          - SUBTITLE
        text:
          type: string
    SessionResponse:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - RESPONDENT
          - ADMINISTRATOR
        departmentCode:
          type: string
        roles:
          type: array
          items:
            type: string
        surveyCode:
          type: string
        surveyYear:
          type: integer
          format: int32
  securitySchemes:
    sessionCookie:
      in: cookie
      name: EDI_SESSION
      type: apiKey

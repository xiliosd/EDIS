openapi: 3.1.0
info:
  description: API de la Encuesta sobre Ambiente y Desempeño Institucional (DANE).
    Las operaciones que modifican datos exigen la cabecera X-XSRF-TOKEN.
  title: API Formulario EDI/EDID
  version: v1
servers:
- url: /
security:
- sessionCookie: []
tags:
- description: Inicio y cierre de sesión
  name: Autenticación
- description: Lectura del cuestionario
  name: Encuesta
paths:
  /api/v1/auth/csrf:
    get:
      description: Emite la cookie XSRF-TOKEN.
      operationId: csrf
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
          description: OK
      security: []
      summary: Obtener token CSRF
      tags:
      - Autenticación
  /api/v1/auth/login:
    post:
      description: Emite la cookie de sesión EDI_SESSION.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión iniciada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Usuario o clave incorrectos
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Demasiados intentos; ver Retry-After
      security: []
      summary: Iniciar sesión
      tags:
      - Autenticación
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Sesión cerrada
      security: []
      summary: Cerrar sesión
      tags:
      - Autenticación
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Sesión vigente
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sin sesión
      summary: Consultar la sesión actual
      tags:
      - Autenticación
  /api/v1/survey/chapters:
    get:
      operationId: listChapters
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChapterSummary"
          description: Capítulos B a H
      summary: Listar los capítulos del cuestionario
      tags:
      - Encuesta
  /api/v1/survey/chapters/{chapterCode}:
    get:
      description: Las preguntas sin columna solo las ve el administrador del cuestionario.
      operationId: getChapter
      parameters:
      - in: path
        name: chapterCode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
          description: Capítulo con sus preguntas
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El capítulo no existe
      summary: Consultar un capítulo
      tags:
      - Encuesta
  /api/v1/survey/pages/{pageCode}:
    get:
      operationId: page
      parameters:
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDetail"
          description: Página
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La página no existe
      summary: "Consultar una página con sus preguntas y, si ya se guardó, sus respuestas"
      tags:
      - Encuesta
  /api/v1/survey/pages/{pageCode}/answers:
    put:
      operationId: saveAnswers
      parameters:
      - in: path
        name: pageCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageAnswersRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSaveResult"
          description: Página guardada; indica la siguiente
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La página no existe
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Página ya guardada o bloqueada
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Respuestas inválidas (errors: columna → mensaje)"
      summary: Guardar las respuestas de una página (una sola vez)
      tags:
      - Encuesta
  /api/v1/survey/progress:
    get:
      operationId: progress
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyProgress"
          description: Estado de las 9 páginas y radicado si terminó
      summary: Consultar el avance del encuestado
      tags:
      - Encuesta
  /api/v1/survey/rules:
    get:
      operationId: rules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
          description: Reglas del archivo más saltos heredados
      summary: Consultar las reglas de saltos y validaciones vigentes
      tags:
      - Encuesta
components:
  schemas:
    AnswerOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    AnswerSpec:
      type: object
      properties:
        columnCode:
          type: string
        columnStatus:
          type: string
          enum:
          - ACTIVE
          - PENDING_COLUMN
        inputType:
          type: string
          enum:
          - SINGLE_CHOICE
          - CHECKBOX
          - TEXT
          - UNKNOWN
        options:
          type: array
          items:
            $ref: "#/components/schemas/AnswerOption"
    ChapterDetail:
      type: object
      properties:
        code:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireEntry"
        module:
          type: string
        title:
          type: string
    ChapterSummary:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
        title:
          type: string
    Condition:
      type: object
      properties:
        alguna:
          type: array
          items:
            type: string
        o:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        op:
          type: string
        pregunta:
          type: string
        todas:
          type: array
          items:
            type: string
        valor:
          type: string
        valores:
          type: array
          items:
            type: string
        "y":
          type: array
          items:
            $ref: "#/components/schemas/Condition"
    CsrfTokenResponse:
      type: object
      properties:
        token:
          type: string
    FieldValidation:
      type: object
      properties:
        longitudMax:
          type: integer
          format: int32
        max:
          type: number
        min:
          type: number
        obligatoria:
          type: boolean
        tipo:
          type: string
    LegacySkip:
      type: object
      properties:
        count:
          type: integer
          format: int32
        triggerValue:
          type: string
    LoginRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - RESPONDENT
          - ADMINISTRATOR
        password:
          type: string
          maxLength: 100
          minLength: 0
        username:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - accountType
      - password
      - username
    PageAnswersRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
      required:
      - answers
    PageDetail:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
        chapterCode:
          type: string
        chapterTitle:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireEntry"
        module:
          type: string
        pageCode:
          type: string
        state:
          type: string
          enum:
          - SAVED
          - AVAILABLE
          - LOCKED
    PageSaveResult:
      type: object
      properties:
        nextPageCode:
          type: string
        pageCode:
          type: string
    PageStatus:
      type: object
      properties:
        chapterCode:
          type: string
        chapterTitle:
          type: string
        module:
          type: string
        pageCode:
          type: string
        state:
          type: string
          enum:
          - SAVED
          - AVAILABLE
          - LOCKED
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    QuestionnaireEntry:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/AnswerSpec"
        headers:
          type: array
          items:
            $ref: "#/components/schemas/SectionHeader"
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - STATEMENT
          - ITEM
        label:
          type: string
        legacySkip:
          $ref: "#/components/schemas/LegacySkip"
        numeral:
          type: string
        pageCode:
          type: string
        text:
          type: string
    RuleSet:
      type: object
      properties:
        anio:
          type: integer
          format: int32
        encuesta:
          type: string
        saltos:
          type: array
          items:
            $ref: "#/components/schemas/SkipRule"
        validaciones:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FieldValidation"
        version:
          type: integer
          format: int32
    SectionHeader:
      type: object
      properties:
        kind:
          type: string
          enum:
          - HEADING
          - SUBTITLE
        text:
          type: string
    SessionResponse:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - RESPONDENT
          - ADMINISTRATOR
        departmentCode:
          type: string
        roles:
          type: array
          items:
            type: string
        surveyCode:
          type: string
        surveyYear:
          type: integer
          format: int32
    SkipAction:
      type: object
      properties:
        accion:
          type: string
        preguntas:
          type: array
          items:
            type: string
    SkipRule:
      type: object
      properties:
        descripcion:
          type: string
        entonces:
          $ref: "#/components/schemas/SkipAction"
        id:
          type: string
        si:
          $ref: "#/components/schemas/Condition"
    SurveyProgress:
      type: object
      properties:
        finished:
          type: boolean
        observationsSaved:
          type: boolean
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageStatus"
        receipt:
          type: string
  securitySchemes:
    sessionCookie:
      in: cookie
      name: EDI_SESSION
      type: apiKey

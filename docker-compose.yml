# Entorno de DESARROLLO. Usa datos ficticios (db/dev); nunca apuntar a la Oracle institucional.
name: formulario-edi

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_DEV_ADMIN_PASSWORD}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: file:/db/dev/schema.sql
      SPRING_SQL_INIT_DATA_LOCATIONS: file:/db/dev/data.sql
      RULES_SEED_DIR: /db/dev/rules-seed
    volumes:
      - ./db/dev:/db/dev:ro
      - rules-data:/data/rules
    depends_on:
      oracle:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rules-data:

[extend]
useDefault = true

[allowlist]
description = "Datos FICTICIOS de desarrollo y pruebas (nunca credenciales reales)"
paths = [
  '''db/dev/.*\.sql''',
  '''backend/src/test/resources/.*''',
  '''\.env\.example''',
  '''backend/src/test/java/.*''',
  '''docs/superpowers/.*''',
]
# Valores de ejemplo públicos de .env.example; PlaceholderSecretsGuard los rechaza al arrancar.
regexes = [
  '''^genere-un-secreto-aleatorio-de-al-menos-32-caracteres$''',
  '''^genere-otra-clave-aleatoria-de-al-menos-32-caracteres$''',
]
